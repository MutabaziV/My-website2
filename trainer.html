<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
   <title>www.MIPC.org</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <style>
        body {
            background-color: aliceblue;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            
        }

        #mut {
            width: 150px;
            text-align: center;
            height: 40px;
            margin: 20px auto;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(10px); }
        }

        #Moon { color: blue; }

        .registration-container {
            max-width: 550px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        h1 {
            color: #2c3e50;
            text-align: center;
            font-size: 24px;
            margin-bottom: 25px;
            border-bottom: 2px solid #3498db;
            display: inline-block;
            width: 100%;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        input[type="text"], 
        input[type="email"], 
        input[type="number"],
        input[type="tel"],
        input[type="file"],
        select {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }

        input[type="submit"] {
            width: 100%;
            background-color: #2c3e50;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.3s;
            margin-top: 10px;
        }

        input[type="submit"]:hover {
            background-color: #34495e;
        }

        #messageBox {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
            display: none;
        }
          a {
            background-color: #2c3e50;
            color: white;
            padding: 8px 15px;
            text-decoration: none;
            border-radius: 5px;
            font-size: 13px;
        }
 .l5 {
            margin-bottom: 25px;
            margin-top: 10px;
        }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    </style>
</head>
<body>

    <div id="mut">
        <h1><span id="Moon">M</span>IPC</h1>
    </div>

    <div class="registration-container">
        <h1>Trainer's Registration Form</h1>
        <form id="trainerForm">
            <div class="form-group">
                <input type="text" id="fullName" placeholder="Full Name (As on ID)">
            </div>
            
            <div class="form-group">
                <input type="email" id="email" placeholder="Professional Email Address">
            </div>

            <div class="form-group">
                <input type="tel" id="phone" placeholder="Phone Number (10 digits)">
            </div>

            <div class="form-group">
                <input type="text" id="idNumber" placeholder="National ID (16 digits)">
            </div>

            <div class="form-group">
                <select id="education">
                    <option value="" disabled selected>Highest Academic Level</option>
                    <option value="Masters">Master's Degree</option>
                    <option value="BTech">Bachelor of Technology (B-Tech)</option>
                    <option value="Bachelors">Bachelor's Degree (A0)</option>
                    <option value="AdvancedDiploma">Advanced Diploma (A1)</option>
                </select>
            </div>

            <div class="form-group">
                <select id="department">
                    <option value="" disabled selected>Select Department / Trade</option>
                    <option value="ICT">Information Communication Technology (ICT)</option>
                    <option value="Masonry">Civil Engineering & Masonry</option>
                    <option value="Culinary">Hospitality & Culinary Arts</option>
                    <option value="General">General Subjects (Math/English)</option>
                </select>
            </div>
  <div class="l5">
                 <a href="appli.html">← Return</a>
            </div>
            <input type="submit" value="Submit Staff Application">
            
            <div id="messageBox"></div>
        </form>
    </div>

    <script>
        document.getElementById('trainerForm').addEventListener('submit', function(event) {
            event.preventDefault(); 

            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const idNumber = document.getElementById('idNumber').value.trim();
            const edu = document.getElementById('education').value;
            const dept = document.getElementById('department').value;
            
            const messageBox = document.getElementById('messageBox');
            messageBox.style.display = "block";
            messageBox.className = "error";

            // Validations
            const isPhoneValid = /^\d{10}$/.test(phone);
            const isIdValid = /^\d{16}$/.test(idNumber);

            if (fullName === "" || email === "" || edu === "" || dept === "") {
                messageBox.innerText = "Please fill in all fields and select your options.";
            } 
            else if (!isPhoneValid) {
                messageBox.innerText = "Invalid Phone! Must be exactly 10 digits (numbers only).";
            } 
            else if (!isIdValid) {
                messageBox.innerText = "Invalid ID! Must be exactly 16 digits (numbers only).";
            } 
            else {
                // Everything is correct
                messageBox.className = "success";
                messageBox.innerText = "Registration successful! Redirecting in 3 seconds...";
                
                setTimeout(function() {
                    window.location.href = "INTERN.html";
                }, 3000);
            }
        });
    </script>

</body>
</html>
